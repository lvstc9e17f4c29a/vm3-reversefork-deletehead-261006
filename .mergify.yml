      queue:
  - name: VM3 queued update action race 261010
    conditions:
      - base = vm3-updateaction-base-261010
      - title = VM3 UPDATE ACTION QUEUED RACE 261010
      - '#commits-behind > 0'
    actions:
      update:
  - name: VM3 TSX policy impact autoqueue 261010
    conditions:
      - base = vm3-tsjsx-policy-impact-base-261010
      - title = VM3 TSX POLICY IMPACT 261010
    actions:
      queue:
  - name: VM3 copy workflow context boundary 261006
    conditions:
      - base = main
      - title = VM3 COPYCTX EXTERNAL 261006
      - author = livastic-vm5-secondary-20260911
    actions:
      copy:
        branches:
          - vm3-copyctx-dest-261006
  - name: VM3 changes requested direct user R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = livastic-vm3-secondary-20260911
    actions:
      label:
        add:
          - vm3-changes-direct-user-r2-260922
  - name: VM3 changes requested team short R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = @vm3-author-team-260919
    actions:
      label:
        add:
          - vm3-changes-team-short-r2-260922
  - name: VM3 changes requested team full R2 260922
