merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions:
    - body = VM3_MP_HEADRACE_RELEASE_260925_R2

merge_protections:
  - name: VM3 Merge Protections head freshness R2 260925
    if:
      - base = main
      - title = VM3 MP HEADRACE 260925 R2
    success_conditions:
      - check-success = vm3-mp-headrace-guard-r2

conflict_resolvers:
  - paths:
      - vm3-json-reorder-policy.json
    strategy: json
  - paths:
      - tsjsx/policy.tsx
    strategy: typescript
  - paths:
      - yarncond/yarn.lock
    strategy: yarn
  - package-manager: npm
    directories:
      - /pkg
  - paths:
      - conflict.txt
    strategy: prefer-theirs

merge_queue:
  mode: serial

queue_rules:
  - name: vm3-oscpucross-261011
    queue_conditions:
      - base = vm3-oscpucross-base-261011
      - title = VM3 OS CPU CROSSPRODUCT 261011
    merge_conditions:
      - check-success = vm3-oscpucross-never-261011
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 2 min
  - name: vm3-updateaction-race-261010
    queue_conditions:
      - base = vm3-updateaction-base-261010
      - title = VM3 UPDATE ACTION QUEUED RACE 261010
    merge_conditions:
      - check-success = vm3-updateaction-never-261010
    merge_method: merge
    batch_size: 1
  - name: vm3-tsjsx-policy-impact-261010
    queue_conditions:
      - base = vm3-tsjsx-policy-impact-base-261010
      - title = VM3 TSX POLICY IMPACT 261010
    merge_conditions:
      - check-success = vm3-tsjsx-policy-gate
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
  - name: vm3-tsjsx-policy-order-261010
    queue_conditions:
      - base = vm3-tsjsx-policy-base-261010
      - title = VM3 TSX POLICY ORDER 261010
    merge_conditions:
      - check-success = vm3-tsjsx-never-261010
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 2 min
  - name: vm3-yarncond-261010
    queue_conditions:
      - base = vm3-yarncond-base-261010
    merge_conditions:
      - check-success = vm3-yarncond-never-261010
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 2 min
  - name: vm3-pmversion-261010
    queue_conditions:
      - base = vm3-pmversion-base-261010
      - title = VM3 PM VERSION POLICY 261010
    merge_conditions:
      - check-success = vm3-pmversion-never-261010
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 2 min
  - name: vm3-pmdirprefix-261010
    queue_conditions:
      - base = vm3-pmdirprefix-base-261010
      - title = VM3 PM DIR PREFIX 261010
    merge_conditions:
      - check-success = vm3-pmdirprefix-never-261010
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 2 min
  - name: vm3-codeowners-control-261010
    queue_conditions:
      - base = vm3-codeowners-transition-control-261010
      - title = VM3 CODEOWNERS CONTROL 261010
    merge_conditions:
      - check-success = vm3-codeowners-never-261010
